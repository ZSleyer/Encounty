name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  ncc:
    name: NCC Quality Suite
    uses: ./.github/workflows/ncc-suite.yml
    secrets: inherit

  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    needs: [test, lint, ncc]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set version from tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          CLEAN_VERSION=$(echo "$TAG_VERSION" | sed 's/^v//' | sed 's/-.*//')
          if [[ "$CLEAN_VERSION" != *.*.* ]]; then
            CLEAN_VERSION="${CLEAN_VERSION}.0"
          fi
          echo "VERSION=$TAG_VERSION" >> $GITHUB_ENV
          echo "CLEAN_VERSION=$CLEAN_VERSION" >> $GITHUB_ENV

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Set Frontend Version
        working-directory: frontend
        run: npm pkg set version="$CLEAN_VERSION"

      - name: Build Frontend
        working-directory: frontend
        run: yarn build

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@latest

      - name: Generate Icons
        run: |
          cd backend
          go run ../scripts/generate_icons.go

      - name: Build Linux Binary
        working-directory: backend
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p ./frontend
          cp -r ../frontend/dist ./frontend/
          go build -ldflags="-s -w -X main.version=$VERSION -X main.commit=$(git rev-parse --short HEAD) -X main.buildDate=$(date -u +%d.%m.%y)" -o ../encounty-backend-linux main.go
          rm -rf ./frontend

      - name: Set Windows resource version
        working-directory: backend
        run: |
          WIN_VER=$(echo "$CLEAN_VERSION" | awk -F. '{if(NF==2) print $0".0"; else print $0}')
          echo "WIN_VER=$WIN_VER" >> $GITHUB_ENV
          # Match any four-part version rather than the one that happened to be
          # committed, so bumping winres.json cannot silently stop the rewrite.
          sed -i -E "s/[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/${WIN_VER}.0/g" winres/winres.json

      - name: Build Windows Binary (x64)
        working-directory: backend
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          $(go env GOPATH)/bin/go-winres make --product-version "${WIN_VER}.0" --file-version "${WIN_VER}.0"
          mkdir -p ./frontend
          cp -r ../frontend/dist ./frontend/
          go build -ldflags="-s -w -X main.version=$VERSION -X main.commit=$(git rev-parse --short HEAD) -X main.buildDate=$(date -u +%d.%m.%y) -H=windowsgui" -o ../encounty-backend-windows.exe main.go
          rm -rf ./frontend
          rm -f *.syso

      - name: Build Windows Binary (arm64)
        working-directory: backend
        env:
          GOOS: windows
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          $(go env GOPATH)/bin/go-winres make --product-version "${WIN_VER}.0" --file-version "${WIN_VER}.0"
          mkdir -p ./frontend
          cp -r ../frontend/dist ./frontend/
          go build -ldflags="-s -w -X main.version=$VERSION -X main.commit=$(git rev-parse --short HEAD) -X main.buildDate=$(date -u +%d.%m.%y) -H=windowsgui" -o ../encounty-backend-windows-arm64.exe main.go
          rm -rf ./frontend
          rm -f *.syso

      - name: Build Electron
        working-directory: electron
        run: |
          yarn install --frozen-lockfile
          npm pkg set version="$CLEAN_VERSION"
          yarn build

      - name: Detect pre-release
        id: prerelease
        run: |
          if [[ "$GITHUB_REF" == *"-pre"* ]] || [[ "$GITHUB_REF" == *"-rc"* ]] || [[ "$GITHUB_REF" == *"-alpha"* ]] || [[ "$GITHUB_REF" == *"-beta"* ]]; then
            echo "is_pre=true" >> $GITHUB_OUTPUT
            echo "publish_flag=never" >> $GITHUB_OUTPUT
          else
            echo "is_pre=false" >> $GITHUB_OUTPUT
            echo "publish_flag=always" >> $GITHUB_OUTPUT
          fi

      - name: Delete existing pre-release (overwrite mode)
        if: steps.prerelease.outputs.is_pre == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "$VERSION" --yes --cleanup-tag 2>/dev/null || true

      - name: Recreate tag at current commit (pre-release overwrite)
        if: steps.prerelease.outputs.is_pre == 'true'
        run: |
          git tag -f "$VERSION"
          git push origin "$VERSION" --force

      - name: Build pre-release body
        if: steps.prerelease.outputs.is_pre == 'true'
        id: prebody
        run: |
          EOF_MARKER=$(openssl rand -hex 8)
          echo "body<<${EOF_MARKER}" >> "$GITHUB_OUTPUT"
          echo "> **Note:** Pre-releases are overwritten on every build. Compare the commit hash to check if you have the latest version." >> "$GITHUB_OUTPUT"
          echo ">" >> "$GITHUB_OUTPUT"
          echo "> The in-app auto-updater only picks up stable releases, so an installer downloaded from a pre-release will not update itself. To move to a newer pre-release build, download and install it manually from this page." >> "$GITHUB_OUTPUT"
          echo ">" >> "$GITHUB_OUTPUT"
          echo "> Commit: \`${GITHUB_SHA::7}\`" >> "$GITHUB_OUTPUT"
          echo "${EOF_MARKER}" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        if: steps.prerelease.outputs.is_pre != 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$VERSION" --json name,body --jq '.name' 2>/dev/null | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract annotated tag message
        if: steps.prerelease.outputs.is_pre != 'true' && steps.existing.outputs.exists != 'true'
        id: tagmsg
        run: |
          TAG_MSG=$(git tag -l --format='%(contents)' "$VERSION")
          if [ -n "$TAG_MSG" ]; then
            EOF_MARKER=$(openssl rand -hex 8)
            echo "body<<${EOF_MARKER}" >> "$GITHUB_OUTPUT"
            echo "$TAG_MSG" >> "$GITHUB_OUTPUT"
            echo "${EOF_MARKER}" >> "$GITHUB_OUTPUT"
            echo "has_body=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: ${{ steps.tagmsg.outputs.has_body != 'true' }}
          prerelease: ${{ steps.prerelease.outputs.is_pre == 'true' }}
          body: ${{ steps.prebody.outputs.body || steps.tagmsg.outputs.body || '' }}

      - name: Package & Publish Electron Linux (x64)
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn package:linux --x64 --publish ${{ steps.prerelease.outputs.publish_flag }}

      # The AUR package installs these into /usr/share/licenses/. Built here
      # because the Electron and Chromium texts are read out of the AppImage
      # that the previous step just produced.
      - name: Build the license bundle
        run: make license-bundle

      - name: Publish the license bundle
        uses: softprops/action-gh-release@v3
        with:
          files: electron/release/Encounty-licenses.tar.gz

      - name: Install Wine for Windows cross-build
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32

      - name: Package & Publish Electron Windows (x64 + arm64)
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable the 7z ARM64 branch filter that the NSIS install stub cannot unpack.
          ELECTRON_BUILDER_7ZIP_PATH: ${{ github.workspace }}/scripts/7za-nofilter.sh
        # Both arches in one invocation share a single latest.yml; the afterPack hook puts
        # the arch-correct backend into each pack, and electron-updater picks the matching
        # installer by arch. So arm64 Windows auto-updates too.
        run: yarn package:win --x64 --arm64 --publish ${{ steps.prerelease.outputs.publish_flag }}

      - name: Build Linux Binary (arm64)
        working-directory: backend
        env:
          GOOS: linux
          GOARCH: arm64
        run: |
          mkdir -p ./frontend
          cp -r ../frontend/dist ./frontend/
          go build -ldflags="-s -w -X main.version=$VERSION -X main.commit=$(git rev-parse --short HEAD) -X main.buildDate=$(date -u +%d.%m.%y)" -o ../encounty-backend-linux main.go
          rm -rf ./frontend

      - name: Package & Publish Electron Linux (arm64)
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Linux arm64 gets its own latest-linux-arm64.yml, so publishing does not
        # clobber the x64 update feed; auto-update works for arm64 Linux users.
        run: yarn package:linux --arm64 --publish ${{ steps.prerelease.outputs.publish_flag }}

      - name: Upload Electron artifacts to pre-release
        if: steps.prerelease.outputs.is_pre == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            electron/release/Encounty-x64.AppImage
            electron/release/Encounty-arm64.AppImage
            electron/release/Encounty.exe
            electron/release/Encounty-Setup.exe

  aur:
    name: Publish AUR package
    runs-on: ubuntu-latest
    needs: [release]
    # Arch turned pushes off on 2026-08-01 while handling an influx of malicious
    # package adoptions and has not announced an end date. The job attempts the
    # publish anyway, since a maintenance window that ended is only visible by
    # trying, and does not fail the release when writes are still down.
    # https://lists.archlinux.org/archives/list/aur-general@lists.archlinux.org/message/YPJ3FQYJTJXXY3RUXCYLMHUKHLIUNVFF/
    #
    # Pre-release tags are moved on every build, which would invalidate the
    # checksums in the AUR package, so only stable tags are pushed.
    continue-on-error: true
    if: >-
      github.repository == 'ZSleyer/Encounty'
      && !contains(github.ref, '-pre')
      && !contains(github.ref, '-rc')
      && !contains(github.ref, '-alpha')
      && !contains(github.ref, '-beta')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Render PKGBUILD from the published release assets
        run: ./scripts/render-aur-pkgbuild.sh "${GITHUB_REF#refs/tags/v}"

      # The AUR keeps reads up while writes are down, so only the authenticated
      # SSH endpoint tells us whether a push can land: it answers with a
      # maintenance banner after the key is accepted. Ride out a short blip, but
      # give up quickly, since a longer outage means the job should stay off
      # rather than burn runner time.
      - name: Wait for AUR writes to be available
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          for attempt in $(seq 1 5); do
            reply=$(ssh -i ~/.ssh/aur -o BatchMode=yes -o ConnectTimeout=15 \
              aur@aur.archlinux.org help 2>&1 || true)
            if ! printf '%s' "$reply" | grep -qi 'maintenance'; then
              echo "AUR writes available after $attempt attempt(s)."
              exit 0
            fi
            echo "AUR writes unavailable, retrying in 60s ($attempt/5)."
            sleep 60
          done
          echo "::error::AUR writes still unavailable. Check the aur-general list."
          exit 1

      - name: Push to the AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: encounty-bin
          pkgbuild: packaging/aur/PKGBUILD
          assets: packaging/aur/encounty.desktop
          commit_username: ZSleyer
          commit_email: aur@zsleyer.de
          commit_message: "Update to ${{ github.ref_name }}"
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}

  release-macos:
    name: Build & Publish macOS
    runs-on: macos-latest
    needs: [test, lint, ncc]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set version from tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          CLEAN_VERSION=$(echo "$TAG_VERSION" | sed 's/^v//' | sed 's/-.*//')
          if [[ "$CLEAN_VERSION" != *.*.* ]]; then
            CLEAN_VERSION="${CLEAN_VERSION}.0"
          fi
          echo "VERSION=$TAG_VERSION" >> $GITHUB_ENV
          echo "CLEAN_VERSION=$CLEAN_VERSION" >> $GITHUB_ENV

      - name: Detect pre-release
        id: prerelease
        run: |
          if [[ "$GITHUB_REF" == *"-pre"* ]] || [[ "$GITHUB_REF" == *"-rc"* ]] || [[ "$GITHUB_REF" == *"-alpha"* ]] || [[ "$GITHUB_REF" == *"-beta"* ]]; then
            echo "publish_flag=never" >> $GITHUB_OUTPUT
          else
            echo "publish_flag=always" >> $GITHUB_OUTPUT
          fi

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Set Frontend Version
        working-directory: frontend
        run: npm pkg set version="$CLEAN_VERSION"

      - name: Build Frontend
        working-directory: frontend
        run: yarn build

      - name: Generate Icons
        run: |
          cd backend
          go run ../scripts/generate_icons.go

      - name: Generate macOS ICNS
        run: |
          mkdir -p electron/build/icon.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size frontend/public/app-icon.png --out "electron/build/icon.iconset/icon_${size}x${size}.png"
          done
          for size in 16 32 128 256; do
            double=$((size*2))
            sips -z $double $double frontend/public/app-icon.png --out "electron/build/icon.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns electron/build/icon.iconset -o electron/build/icon.icns
          rm -rf electron/build/icon.iconset

      - name: Build macOS Binary
        working-directory: backend
        env:
          CGO_ENABLED: '1'
          GOOS: darwin
          GOARCH: arm64
        run: |
          mkdir -p ./frontend
          cp -r ../frontend/dist ./frontend/
          go build -ldflags="-s -w -X main.version=$VERSION -X main.commit=$(git rev-parse --short HEAD) -X main.buildDate=$(date -u +%d.%m.%y)" -o ../encounty-backend-darwin main.go
          rm -rf ./frontend

      - name: Build Electron macOS
        working-directory: electron
        run: |
          yarn install --frozen-lockfile
          npm pkg set version="$CLEAN_VERSION"
          yarn build
          yarn package:mac --publish never

      - name: Upload macOS artifacts to release
        uses: softprops/action-gh-release@v3
        with:
          files: electron/release/Encounty-arm64.dmg
