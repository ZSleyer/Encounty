components:
  schemas:
    backgrounds.backgroundUploadRequest:
      properties:
        image_base64:
          type: string
      type: object
    backgrounds.filenameResponse:
      properties:
        filename:
          type: string
      type: object
    backup.restoreResponse:
      properties:
        ok:
          type: boolean
      type: object
    catchrefs.Ability:
      properties:
        names:
          additionalProperties:
            type: string
          type: object
        slug:
          type: string
      type: object
    catchrefs.Ball:
      properties:
        games:
          items:
            type: string
          type: array
          uniqueItems: false
        generations:
          items:
            type: integer
          type: array
          uniqueItems: false
        names:
          additionalProperties:
            type: string
          type: object
        slug:
          type: string
      type: object
    catchrefs.Location:
      properties:
        names:
          additionalProperties:
            type: string
          type: object
        slug:
          type: string
      type: object
    catchrefs.Mark:
      properties:
        gen:
          type: integer
        names:
          additionalProperties:
            type: string
          type: object
        slug:
          type: string
      type: object
    catchrefs.Nature:
      properties:
        lowers:
          type: string
        names:
          additionalProperties:
            type: string
          type: object
        raises:
          type: string
        slug:
          type: string
      type: object
    catchrefs.Refs:
      properties:
        abilities:
          items:
            $ref: '#/components/schemas/catchrefs.Ability'
          type: array
          uniqueItems: false
        balls:
          items:
            $ref: '#/components/schemas/catchrefs.Ball'
          type: array
          uniqueItems: false
        marks:
          items:
            $ref: '#/components/schemas/catchrefs.Mark'
          type: array
          uniqueItems: false
        natures:
          items:
            $ref: '#/components/schemas/catchrefs.Nature'
          type: array
          uniqueItems: false
        ribbons:
          items:
            $ref: '#/components/schemas/catchrefs.Ribbon'
          type: array
          uniqueItems: false
      type: object
    catchrefs.Ribbon:
      properties:
        category:
          type: string
        gen:
          type: integer
        names:
          additionalProperties:
            type: string
          type: object
        slug:
          type: string
      type: object
    database.EncounterStats:
      properties:
        first_at:
          type: string
        last_at:
          type: string
        rate_per_hour:
          type: number
        today:
          type: integer
        total:
          type: integer
      type: object
    database.OverviewStats:
      properties:
        today:
          type: integer
        total_encounters:
          type: integer
        total_pokemon:
          type: integer
      type: object
    detector.importResponse:
      properties:
        imported:
          type: integer
      type: object
    detector.importTemplatesRequest:
      properties:
        source_pokemon_id:
          type: string
        template_indices:
          items:
            type: integer
          type: array
          uniqueItems: false
      type: object
    detector.matchSubmitRequest:
      properties:
        category:
          description: Category is the counting category that fired, empty for the
            default one.
          type: string
        frame_delta:
          type: number
        match_id:
          description: |-
            MatchID identifies one confirmed match on the client. It stays the same
            across retries of the same match so the server can dedupe a request it
            already processed when the response was lost in transit.
          type: string
        score:
          type: number
      type: object
    detector.matchSubmitResponse:
      properties:
        confidence:
          type: number
        matched:
          type: boolean
      type: object
    detector.templateUploadRequest:
      properties:
        calibration:
          description: |-
            Calibration is the opaque stability calibration JSON computed by the
            frontend test step; persisted as-is.
          items:
            type: integer
          type: array
          uniqueItems: false
        consecutive_hits:
          type: integer
        cooldown_sec:
          type: integer
        hysteresis_factor:
          type: number
        hysteresis_mode:
          type: string
        imageBase64:
          type: string
        max_poll_ms:
          type: integer
        min_poll_ms:
          type: integer
        name:
          type: string
        poll_interval_ms:
          type: integer
        precision:
          description: |-
            The detection-setting fields below seed this template's own values;
            nil means the engine's hardcoded fallback applies.
          type: number
        regions:
          items:
            $ref: '#/components/schemas/state.MatchedRegion'
          type: array
          uniqueItems: false
      type: object
    detector.templateUploadResponse:
      properties:
        index:
          type: integer
        template_db_id:
          type: integer
      type: object
    games.locationsResponse:
      properties:
        group:
          type: string
        locations:
          items:
            $ref: '#/components/schemas/catchrefs.Location'
          type: array
          uniqueItems: false
      type: object
    games.pokedexSyncResponse:
      properties:
        added:
          type: integer
        namesUpdated:
          type: integer
        new:
          items:
            type: string
          type: array
          uniqueItems: false
        total:
          type: integer
      type: object
    gamesync.GameEntry:
      properties:
        generation:
          type: integer
        key:
          type: string
        names:
          additionalProperties:
            type: string
          type: object
        platform:
          type: string
      type: object
    gamesync.GamesSyncResult:
      properties:
        added:
          type: integer
        updated:
          type: integer
      type: object
    httputil.ErrResp:
      properties:
        error:
          type: string
      type: object
    licenses.Entry:
      properties:
        license:
          type: string
        name:
          type: string
        source:
          type: string
        text:
          type: string
        version:
          type: string
      type: object
    permissions.Status:
      properties:
        accessibility:
          type: boolean
        screen_recording:
          type: boolean
      type: object
    permissions.requestBody:
      properties:
        permission:
          type: string
      type: object
    pokedex.Entry:
      properties:
        canonical:
          type: string
        evolves_from_id:
          type: integer
        forms:
          items:
            $ref: '#/components/schemas/pokedex.Form'
          type: array
          uniqueItems: false
        games:
          items:
            type: string
          type: array
          uniqueItems: false
        gender_rate:
          type: integer
        id:
          type: integer
        names:
          additionalProperties:
            type: string
          type: object
      type: object
    pokedex.Form:
      properties:
        canonical:
          type: string
        form_names:
          additionalProperties:
            type: string
          type: object
        gender:
          type: string
        generations:
          items:
            type: integer
          type: array
          uniqueItems: false
        names:
          additionalProperties:
            type: string
          type: object
        sprite_id:
          type: integer
        sprite_slug:
          type: string
      type: object
    pokedex.Override:
      properties:
        caught:
          type: boolean
        form_canonical:
          type: string
        game:
          type: string
        gender:
          type: string
        id:
          type: integer
        meta:
          $ref: '#/components/schemas/state.CatchMeta'
        pokedex_id:
          type: string
        seen:
          type: boolean
        species_id:
          type: integer
        updated_at:
          type: string
      type: object
    pokemon.CatchMetaRequest:
      properties:
        ability:
          type: string
        atk:
          type: integer
        ball:
          type: string
        def:
          type: integer
        evolutions:
          description: |-
            Evolutions records every later species or form this individual reached,
            in order. The original catch remains Pokemon.CanonicalName.
          items:
            $ref: '#/components/schemas/state.EvolutionStep'
          type: array
          uniqueItems: false
        gender:
          type: string
        hp:
          type: integer
        level:
          description: |-
            Level and the six values below are pointers because 0 is a legal DV: a
            Pokemon with 0 Speed and one whose Speed was never noted down are
            different facts and both must round-trip unchanged.
          type: integer
        location:
          type: string
        mark:
          description: 'Mark holds at most one mark slug: a Pokemon can never carry
            two.'
          type: string
        nature:
          type: string
        nickname:
          type: string
        ribbons:
          description: |-
            Ribbons holds ribbon slugs. Always a JSON array, never null, matching
            the contract of Pokemon.Tags.
          items:
            type: string
          type: array
          uniqueItems: false
        shiny_variant:
          description: |-
            ShinyVariant records which shiny sparkle the individual showed:
            "" (any/unrecorded), "star" or "square". Sword/Shield specific.
          type: string
        sp_atk:
          type: integer
        sp_def:
          type: integer
        speed:
          type: integer
        sprite_url:
          type: string
      type: object
    pokemon.countResponse:
      properties:
        count:
          type: integer
      type: object
    pokemon.endPhaseRequest:
      properties:
        base_name:
          type: string
        canonical_name:
          type: string
        failed:
          description: |-
            Failed marks the resulting phase entry as sighted-but-not-caught instead
            of a regular catch.
          type: boolean
        form_name:
          type: string
        gender:
          type: string
        name:
          type: string
        sprite_url:
          type: string
      type: object
    pokemon.reorderRequest:
      properties:
        order:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    pokemon.setCompletedAtRequest:
      properties:
        completed_at:
          type: string
      type: object
    pokemon.setEncountersRequest:
      properties:
        count:
          type: integer
      type: object
    pokemon.setTimerRequest:
      properties:
        ms:
          type: integer
      type: object
    pokemon.spriteResponse:
      properties:
        sprite_url:
          type: string
      type: object
    settings.captureResolutionRequest:
      properties:
        device_key:
          type: string
        resolution:
          type: string
      type: object
    settings.hotkeyUpdateResponse:
      properties:
        action:
          type: string
        key:
          type: string
      type: object
    settings.hotkeysStatusResponse:
      properties:
        available:
          type: boolean
      type: object
    settings.pathResponse:
      properties:
        path:
          type: string
      type: object
    settings.setConfigPathRequest:
      properties:
        path:
          type: string
      type: object
    settings.statusResponse:
      properties:
        status:
          type: string
      type: object
    settings.updateHotkeyRequest:
      properties:
        key:
          type: string
      type: object
    state.AppState:
      properties:
        active_group_id:
          type: string
        active_id:
          type: string
        data_path:
          type: string
        groups:
          description: Organizational Sidebar sections; always an array, never null
          items:
            $ref: '#/components/schemas/state.Group'
          type: array
          uniqueItems: false
        hotkeys:
          $ref: '#/components/schemas/state.HotkeyMap'
        license_accepted:
          type: boolean
        pokemon:
          items:
            $ref: '#/components/schemas/state.Pokemon'
          type: array
          uniqueItems: false
        sessions:
          items:
            $ref: '#/components/schemas/state.Session'
          type: array
          uniqueItems: false
        settings:
          $ref: '#/components/schemas/state.Settings'
      type: object
    state.CatchMeta:
      description: |-
        Catch holds the optional details recorded for this catch. Nil means
        nothing was recorded, which is the state of every entry predating the
        feature and of every hunt that is not finished yet.
      properties:
        ability:
          type: string
        atk:
          type: integer
        ball:
          type: string
        def:
          type: integer
        evolutions:
          description: |-
            Evolutions records every later species or form this individual reached,
            in order. The original catch remains Pokemon.CanonicalName.
          items:
            $ref: '#/components/schemas/state.EvolutionStep'
          type: array
          uniqueItems: false
        hp:
          type: integer
        level:
          description: |-
            Level and the six values below are pointers because 0 is a legal DV: a
            Pokemon with 0 Speed and one whose Speed was never noted down are
            different facts and both must round-trip unchanged.
          type: integer
        location:
          type: string
        mark:
          description: 'Mark holds at most one mark slug: a Pokemon can never carry
            two.'
          type: string
        nature:
          type: string
        nickname:
          type: string
        ribbons:
          description: |-
            Ribbons holds ribbon slugs. Always a JSON array, never null, matching
            the contract of Pokemon.Tags.
          items:
            type: string
          type: array
          uniqueItems: false
        shiny_variant:
          description: |-
            ShinyVariant records which shiny sparkle the individual showed:
            "" (any/unrecorded), "star" or "square". Sword/Shield specific.
          type: string
        sp_atk:
          type: integer
        sp_def:
          type: integer
        speed:
          type: integer
      type: object
    state.CounterElement:
      properties:
        height:
          type: integer
        idle_animation:
          type: string
        label_style:
          $ref: '#/components/schemas/state.TextStyle'
        label_text:
          type: string
        prefix_text:
          type: string
        show_label:
          type: boolean
        style:
          $ref: '#/components/schemas/state.TextStyle'
        suffix_text:
          type: string
        trigger_decrement:
          type: string
        trigger_enter:
          type: string
        visible:
          type: boolean
        width:
          type: integer
        x:
          type: integer
        "y":
          type: integer
        z_index:
          type: integer
      type: object
    state.DetectionLogEntry:
      properties:
        at:
          description: At is the UTC timestamp when the match was confirmed.
          type: string
        category:
          description: Category is the counting category that fired, empty for the
            default one.
          type: string
        confidence:
          description: Confidence is the NCC score that triggered the match (0.0–1.0).
          type: number
      type: object
    state.DetectorConfig:
      properties:
        adaptive_cooldown:
          type: boolean
        adaptive_cooldown_min:
          description: Minimum seconds, default 3
          type: integer
        change_threshold:
          description: |-
            ChangeThreshold is the pixel-delta fraction required to leave MATCH
            state. Unlike precision/hysteresis/cooldown/hits/polling, this stays a
            hunt-level setting; it is not exposed as a per-template control.
          type: number
        detection_log:
          description: last maxDetectionLog confirmed matches
          items:
            $ref: '#/components/schemas/state.DetectionLogEntry'
          type: array
          uniqueItems: false
        enabled:
          type: boolean
        region:
          $ref: '#/components/schemas/state.DetectorRect'
        source_type:
          description: '"screen_region" | "window" | "camera"'
          type: string
        templates:
          description: replaces TemplatePaths
          items:
            $ref: '#/components/schemas/state.DetectorTemplate'
          type: array
          uniqueItems: false
        window_title:
          type: string
      type: object
    state.DetectorRect:
      properties:
        h:
          type: integer
        w:
          type: integer
        x:
          type: integer
        "y":
          type: integer
      type: object
    state.DetectorTemplate:
      properties:
        calibration:
          description: |-
            Calibration holds frontend-computed stability calibration as an opaque
            JSON object. The backend only persists and forwards it; the detection
            engine in the frontend owns its shape.
          items:
            type: integer
          type: array
          uniqueItems: false
        consecutive_hits:
          description: |-
            ConsecutiveHits is this template's own required consecutive matching
            frames before counting an encounter. nil falls back to a hardcoded default.
          type: integer
        cooldown_sec:
          description: |-
            CooldownSec is this template's own minimum seconds between counts.
            nil falls back to a hardcoded default.
          type: integer
        enabled:
          description: nil = true (backward compat)
          type: boolean
        hysteresis_factor:
          description: |-
            HysteresisFactor is this template's own hysteresis exit-threshold
            multiplier. nil falls back to a hardcoded default.
          type: number
        hysteresis_mode:
          description: |-
            HysteresisMode selects how the detection engine re-arms after a match.
            nil or "score" means the legacy score-based hysteresis exit; "region"
            makes the detector watch the matched regions' pixel content and re-arm
            only when it actually changes (for 3D games). The backend only validates
            and persists this value; the frontend detection engine owns the semantics.
          type: string
        image_path:
          description: legacy filesystem path
          type: string
        max_poll_ms:
          description: |-
            MaxPollMs is this template's own slowest adaptive-polling interval.
            nil falls back to a hardcoded default.
          type: integer
        min_poll_ms:
          description: |-
            MinPollMs is this template's own fastest adaptive-polling interval.
            nil falls back to a hardcoded default.
          type: integer
        name:
          description: user-visible template name
          type: string
        poll_interval_ms:
          description: |-
            PollIntervalMs is this template's own base adaptive-polling interval.
            nil falls back to a hardcoded default.
          type: integer
        precision:
          description: |-
            Precision is this template's own NCC match threshold (0.0-1.0). nil
            means no explicit value has been set yet; the detection engine falls
            back to a hardcoded default.
          type: number
        regions:
          items:
            $ref: '#/components/schemas/state.MatchedRegion'
          type: array
          uniqueItems: false
        template_db_id:
          description: DB primary key
          type: integer
      type: object
    state.EvolutionStep:
      properties:
        canonical_name:
          type: string
        gender:
          type: string
      type: object
    state.GradientStop:
      properties:
        color:
          type: string
        position:
          type: number
      type: object
    state.Group:
      properties:
        collapsed:
          type: boolean
        color:
          description: Hex string like "#3b82f6"; empty means default color
          type: string
        id:
          type: string
        name:
          type: string
        sort_order:
          type: integer
      type: object
    state.HotkeyMap:
      properties:
        decrement:
          type: string
        hunt_toggle:
          description: HuntToggle starts or stops the hunt (timer + detector) for
            the active Pokémon.
          type: string
        increment:
          type: string
        next_pokemon:
          type: string
        reset:
          type: string
      type: object
    state.LabeledTextElement:
      description: |-
        TotalTimer renders the hunt time across all phases. Like Timer it offers
        an idle animation only, which saves one animation channel.
      properties:
        height:
          type: integer
        idle_animation:
          type: string
        label_style:
          $ref: '#/components/schemas/state.TextStyle'
        label_text:
          type: string
        prefix_text:
          type: string
        show_label:
          type: boolean
        style:
          $ref: '#/components/schemas/state.TextStyle'
        suffix_text:
          type: string
        trigger_decrement:
          type: string
        trigger_enter:
          type: string
        visible:
          type: boolean
        width:
          type: integer
        x:
          type: integer
        "y":
          type: integer
        z_index:
          type: integer
      type: object
    state.MatchedRegion:
      properties:
        category:
          description: |-
            Category is the optional counting group a region belongs to. Regions
            sharing a category are AND-combined and counted independently from other
            categories. Empty means the default category (legacy single-counter).
          type: string
        expected_text:
          description: used if Type == "text"
          type: string
        rect:
          $ref: '#/components/schemas/state.DetectorRect'
        type:
          description: '"image" | "text"'
          type: string
      type: object
    state.NameElement:
      properties:
        height:
          type: integer
        idle_animation:
          type: string
        style:
          $ref: '#/components/schemas/state.TextStyle'
        trigger_decrement:
          type: string
        trigger_enter:
          type: string
        visible:
          type: boolean
        width:
          type: integer
        x:
          type: integer
        "y":
          type: integer
        z_index:
          type: integer
      type: object
    state.OddsElement:
      properties:
        format:
          description: '"fractional" | "percent"'
          type: string
        height:
          type: integer
        idle_animation:
          type: string
        label_style:
          $ref: '#/components/schemas/state.TextStyle'
        label_text:
          type: string
        prefix_text:
          type: string
        show_label:
          type: boolean
        style:
          $ref: '#/components/schemas/state.TextStyle'
        suffix_text:
          type: string
        trigger_decrement:
          type: string
        trigger_enter:
          type: string
        visible:
          type: boolean
        width:
          type: integer
        x:
          type: integer
        "y":
          type: integer
        z_index:
          type: integer
      type: object
    state.OverlaySettings:
      description: Pokemon-specific overlay settings
      properties:
        background_animation:
          type: string
        background_animation_config:
          items:
            type: integer
          type: array
          uniqueItems: false
        background_animation_speed:
          type: number
        background_color:
          type: string
        background_image:
          type: string
        background_image_fit:
          type: string
        background_opacity:
          type: number
        blur:
          type: integer
        border_color:
          type: string
        border_radius:
          type: integer
        border_width:
          type: integer
        canvas_height:
          type: integer
        canvas_width:
          type: integer
        counter:
          $ref: '#/components/schemas/state.CounterElement'
        hidden:
          type: boolean
        name:
          $ref: '#/components/schemas/state.NameElement'
        odds:
          $ref: '#/components/schemas/state.OddsElement'
        phase:
          $ref: '#/components/schemas/state.LabeledTextElement'
        show_border:
          type: boolean
        sprite:
          $ref: '#/components/schemas/state.SpriteElement'
        timer:
          $ref: '#/components/schemas/state.TimerElement'
        title:
          $ref: '#/components/schemas/state.TitleElement'
        total_counter:
          $ref: '#/components/schemas/state.LabeledTextElement'
        total_timer:
          $ref: '#/components/schemas/state.LabeledTextElement'
      type: object
    state.PhaseTarget:
      properties:
        canonical_name:
          description: English PokéAPI slug, unique per hunt
          type: string
        gender:
          type: string
        name:
          description: Display name (localized)
          type: string
        sprite_url:
          type: string
      type: object
    state.Pokemon:
      properties:
        base_name:
          type: string
        canonical_name:
          description: English PokéAPI slug
          type: string
        catch:
          $ref: '#/components/schemas/state.CatchMeta'
        completed_at:
          type: string
        created_at:
          type: string
        detector_config:
          $ref: '#/components/schemas/state.DetectorConfig'
        encounters:
          type: integer
        entry_source:
          description: |-
            EntrySource records how the entry came to be: "" means the hunt was
            tracked in this app, "manual" means it was entered by hand after the
            fact. Immutable after creation.
          type: string
        failed:
          type: boolean
        form_name:
          type: string
        game:
          description: key from games.json
          type: string
        gender:
          type: string
        group_id:
          description: Empty string means "no group" (shown in "Ohne Gruppe" section)
          type: string
        hunt_mode:
          description: '"both" | "timer" | "detector" (default "both")'
          type: string
        hunt_type:
          type: string
        id:
          type: string
        is_active:
          type: boolean
        language:
          description: '"de" | "en"'
          type: string
        name:
          description: Display name (localized)
          type: string
        nickname:
          type: string
        overlay:
          $ref: '#/components/schemas/state.OverlaySettings'
        overlay_mode:
          description: '"default" | "custom" | "linked:<pokemon-id>"'
          type: string
        phase_number:
          description: |-
            PhaseNumber is the frozen number of this phase within its parent hunt
            (1-based). Zero for entries that are not phases. Immutable after creation.
          type: integer
        phase_of:
          description: |-
            PhaseOf is the ID of the hunt this entry is a phase of. Empty means the
            entry is a hunt of its own. Immutable after creation.
          type: string
        phase_targets:
          description: |-
            PhaseTargets lists the species the hunter expects as off-target shinies.
            Always a JSON array, never null.
          items:
            $ref: '#/components/schemas/state.PhaseTarget'
          type: array
          uniqueItems: false
        pokedex_ids:
          description: User Pokédexes this hunt/catch belongs to.
          items:
            type: string
          type: array
          uniqueItems: false
        shiny_charm:
          type: boolean
        shiny_variant:
          description: '"" (any) | "star" | "square"; Sword/Shield specific'
          type: string
        sort_order:
          description: Manual ordering position (ascending); assigned via ReorderPokemon
          type: integer
        sprite_style:
          description: '"classic" | "animated" | "3d" | "artwork"'
          type: string
        sprite_type:
          description: '"normal" | "shiny"'
          type: string
        sprite_url:
          type: string
        step:
          description: Increment/decrement step size (default 1)
          type: integer
        tags:
          description: Arbitrary short labels; always a JSON array, never null
          items:
            type: string
          type: array
          uniqueItems: false
        timer_accumulated_ms:
          type: integer
        timer_started_at:
          type: string
        title:
          description: User-defined custom title
          type: string
      type: object
    state.Session:
      properties:
        encounters:
          type: integer
        ended_at:
          type: string
        id:
          type: string
        pokemon_id:
          type: string
        started_at:
          type: string
      type: object
    state.Settings:
      properties:
        accent_color:
          description: 'preset key: violet|acid|crimson|cyan|blue|green|pink|orange'
          type: string
        auto_save:
          type: boolean
        capture_resolutions:
          additionalProperties:
            type: string
          description: |-
            CaptureResolutions maps a camera deviceId to a preferred capture
            resolution preset ("auto"|"720"|"1080"|"1440"). Per-device because the
            resolution depends on the physical capture card. Always non-nil so the
            JSON broadcast never emits null.
          type: object
        config_path:
          description: custom data directory override
          type: string
        crisp_sprites:
          type: boolean
        languages:
          description: active game-name languages; default ["de","en"]
          items:
            type: string
          type: array
          uniqueItems: false
        output_dir:
          type: string
        output_enabled:
          type: boolean
        overlay:
          $ref: '#/components/schemas/state.OverlaySettings'
        tutorial_seen:
          $ref: '#/components/schemas/state.TutorialFlags'
      type: object
    state.SpriteElement:
      properties:
        cycle_interval_ms:
          description: CycleIntervalMs is the dwell time per sprite while cycling.
          type: integer
        cycle_phase_targets:
          description: |-
            CyclePhaseTargets makes the sprite rotate through the hunt's phase
            targets instead of showing the hunted species only.
          type: boolean
        cycle_transition:
          description: |-
            CycleTransition names the effect played on a sprite swap while cycling:
            "none", "fade", "wipe-lr" or "wipe-rl". An empty or unknown value renders
            as "fade", the effect cycling shipped with.
          type: string
        glow_blur:
          type: integer
        glow_color:
          type: string
        glow_opacity:
          type: number
        height:
          type: integer
        idle_animation:
          type: string
        show_glow:
          type: boolean
        trigger_decrement:
          type: string
        trigger_enter:
          type: string
        visible:
          type: boolean
        width:
          type: integer
        x:
          type: integer
        "y":
          type: integer
        z_index:
          type: integer
      type: object
    state.TextStyle:
      properties:
        color:
          type: string
        color_type:
          description: '"solid" | "gradient"'
          type: string
        font_family:
          type: string
        font_size:
          type: integer
        font_weight:
          type: integer
        gradient_angle:
          type: integer
        gradient_stops:
          items:
            $ref: '#/components/schemas/state.GradientStop'
          type: array
          uniqueItems: false
        outline_color:
          type: string
        outline_gradient_angle:
          type: integer
        outline_gradient_stops:
          items:
            $ref: '#/components/schemas/state.GradientStop'
          type: array
          uniqueItems: false
        outline_type:
          description: '"none" | "solid" | "gradient"'
          type: string
        outline_width:
          type: integer
        text_align:
          type: string
        text_shadow:
          type: boolean
        text_shadow_blur:
          type: integer
        text_shadow_color:
          type: string
        text_shadow_x:
          type: integer
        text_shadow_y:
          type: integer
      type: object
    state.TimerElement:
      properties:
        height:
          type: integer
        idle_animation:
          type: string
        label_style:
          $ref: '#/components/schemas/state.TextStyle'
        label_text:
          type: string
        prefix_text:
          type: string
        show_label:
          type: boolean
        style:
          $ref: '#/components/schemas/state.TextStyle'
        suffix_text:
          type: string
        visible:
          type: boolean
        width:
          type: integer
        x:
          type: integer
        "y":
          type: integer
        z_index:
          type: integer
      type: object
    state.TitleElement:
      properties:
        height:
          type: integer
        idle_animation:
          type: string
        style:
          $ref: '#/components/schemas/state.TextStyle'
        trigger_decrement:
          type: string
        trigger_enter:
          type: string
        visible:
          type: boolean
        width:
          type: integer
        x:
          type: integer
        "y":
          type: integer
        z_index:
          type: integer
      type: object
    state.TutorialFlags:
      properties:
        auto_detection:
          type: boolean
        overlay_editor:
          type: boolean
      type: object
    system.licenseAcceptResponse:
      properties:
        license_accepted:
          type: boolean
      type: object
    system.overlayStateResponse:
      properties:
        active_id:
          type: string
        active_pokemon:
          $ref: '#/components/schemas/state.Pokemon'
      type: object
    system.readyStatusResponse:
      properties:
        dev_mode:
          type: boolean
        ready:
          type: boolean
        setup_pending:
          type: boolean
      type: object
    system.statusResponse:
      properties:
        status:
          type: string
      type: object
    system.versionResponse:
      properties:
        build_date:
          type: string
        commit:
          type: string
        display:
          type: string
        version:
          type: string
      type: object
    updater.UpdateInfo:
      properties:
        available:
          type: boolean
        current_version:
          type: string
        latest_version:
          type: string
      type: object
externalDocs:
  description: ""
  url: ""
info:
  description: Pokémon Shiny Encounter Counter — REST API
  title: Encounty API
  version: "1.0"
openapi: 3.1.0
paths:
  /backgrounds/{filename}:
    delete:
      parameters:
      - description: Image filename
        in: path
        name: filename
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                type: string
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      summary: Delete a background image
      tags:
      - backgrounds
    get:
      parameters:
      - description: Image filename
        in: path
        name: filename
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            image/jpeg:
              schema:
                type: file
            image/png:
              schema:
                type: file
          description: OK
        "400":
          content:
            image/jpeg:
              schema:
                type: string
            image/png:
              schema:
                type: string
          description: Bad Request
        "404":
          content:
            image/jpeg:
              schema:
                type: string
            image/png:
              schema:
                type: string
          description: Not Found
      summary: Serve a background image
      tags:
      - backgrounds
  /backgrounds/upload:
    post:
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/backgrounds.backgroundUploadRequest'
                description: Base64-encoded image
                summary: body
        description: Base64-encoded image
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/backgrounds.filenameResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                type: string
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal Server Error
      summary: Upload a background image
      tags:
      - backgrounds
  /backup:
    get:
      responses:
        "200":
          content:
            application/zip:
              schema:
                type: file
          description: OK
      summary: Download a backup ZIP
      tags:
      - system
  /capture/resolution:
    put:
      description: Sets the preferred resolution for one camera device
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/settings.captureResolutionRequest'
                description: Device key and resolution
                summary: body
        description: Device key and resolution
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/settings.captureResolutionRequest'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httputil.ErrResp'
          description: Bad Request
      summary: Update capture resolution
      tags:
      - settings
  /catch-refs:
    get:
      description: Returns natures, balls, abilities, ribbons and marks
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/catchrefs.Refs'
          description: OK
      summary: Get the catch reference lists
      tags:
      - catchrefs
  /catch-refs/locations:
    get:
      parameters:
      - description: Game key from /api/games
        in: query
        name: game
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/games.locationsResponse'
          description: OK
      summary: Get the met locations of a game
      tags:
      - catchrefs
  /detector/{id}/config:
    get:
      parameters:
      - description: Pokemon ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/state.DetectorConfig'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httputil.ErrResp'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httputil.ErrResp'
          description: Not Found
      summary: Get or set detector config for a Pokemon
      tags:
      - detector
    post:
      parameters:
      - description: Pokemon ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/state.DetectorConfig'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httputil.ErrResp'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httputil.ErrResp'
          description: Not Found
      summary: Get or set detector config for a Pokemon
      tags:
      - detector
  /detector/{id}/detection_log:
    delete:
      description: Removes all detection log entries for the given Pokemon.
      parameters:
      - description: Pokemon ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Detection log cleared
        "405":
          description: Method not allowed
      summary: Clear detection log for a Pokemon
      tags:
      - Detector
  /detector/{id}/export_templates:
    get:
      parameters:
      - description: Pokemon ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/zip:
              schema:
                type: file
          description: OK
        "404":
          content:
            application/zip:
              schema:
                $ref: '#/components/schemas/httputil.ErrResp'
          description: Not Found
      summary: Export templates as ZIP
      tags:
      - detector
  /detector/{id}/import_templates:
    post:
      parameters:
      - description: Target Pokemon ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/detector.importTemplatesRequest'
                description: Source Pokemon ID
                summary: body
        description: Source Pokemon ID
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/detector.importResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httputil.ErrResp'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httputil.ErrResp'
          description: Not Found
      summary: Import templates from another Pokemon
      tags:
      - detector
  /detector/{id}/import_templates_file:
    post:
      parameters:
      - description: Pokemon ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              title: file
              type: file
          multipart/form-data:
            schema:
              type: object
        description: Template ZIP file
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/detector.importResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httputil.ErrResp'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httputil.ErrResp'
          description: Not Found
      summary: Import templates from uploaded ZIP
      tags:
      - detector
  /detector/{id}/match:
    post:
      parameters:
      - description: Pokemon ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/detector.matchSubmitRequest'
                description: Match score
                summary: body
        description: Match score
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/detector.matchSubmitResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httputil.ErrResp'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httputil.ErrResp'
          description: Not Found
        "405":
          content:
            application/json:
              schema:
                type: string
          description: Method Not Allowed
      summary: Submit a WebGPU match score for a Pokemon
      tags:
      - detector
  /detector/{id}/template/{n}:
    delete:
      parameters:
      - description: Pokemon ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Template index
        in: path
        name: "n"
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                type: file
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httputil.ErrResp'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httputil.ErrResp'
          description: Not Found
      summary: Get, delete or update a detector template
      tags:
      - detector
    get:
      parameters:
      - description: Pokemon ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Template index
        in: path
        name: "n"
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                type: file
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httputil.ErrResp'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httputil.ErrResp'
          description: Not Found
      summary: Get, delete or update a detector template
      tags:
      - detector
    patch:
      parameters:
      - description: Pokemon ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Template index
        in: path
        name: "n"
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                type: file
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httputil.ErrResp'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httputil.ErrResp'
          description: Not Found
      summary: Get, delete or update a detector template
      tags:
      - detector
  /detector/{id}/template_upload:
    post:
      parameters:
      - description: Pokemon ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/detector.templateUploadRequest'
                description: Base64 image and regions
                summary: body
        description: Base64 image and regions
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/detector.templateUploadResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httputil.ErrResp'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httputil.ErrResp'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httputil.ErrResp'
          description: Internal Server Error
      summary: Upload a new template image
      tags:
      - detector
  /detector/{id}/templates:
    delete:
      description: Removes all templates and their images for the given Pokemon.
      parameters:
      - description: Pokemon ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Templates cleared
        "405":
          description: Method not allowed
      summary: Clear all templates for a Pokemon
      tags:
      - Detector
  /detector/screenshot:
    get:
      responses:
        "200":
          content:
            image/jpeg:
              schema:
                type: file
          description: OK
        "500":
          content:
            image/jpeg:
              schema:
                $ref: '#/components/schemas/httputil.ErrResp'
          description: Internal Server Error
      summary: Capture primary monitor screenshot
      tags:
      - detector
  /games:
    get:
      description: Returns the games list sorted by generation
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/gamesync.GameEntry'
                type: array
          description: OK
      summary: Get games list
      tags:
      - games
  /games/sync:
    post:
      description: Triggers a background sync of game metadata from PokeAPI
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gamesync.GamesSyncResult'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httputil.ErrResp'
          description: Internal Server Error
      summary: Sync games from PokeAPI
      tags:
      - games
  /hotkeys:
    post:
      description: Replaces the full hotkey map and re-registers all bindings
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/state.HotkeyMap'
                description: Complete hotkey map
                summary: hotkeys
        description: Complete hotkey map
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/state.HotkeyMap'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httputil.ErrResp'
          description: Bad Request
      summary: Update all hotkeys
      tags:
      - hotkeys
  /hotkeys/{action}:
    put:
      description: Updates one action's key binding without touching the others
      parameters:
      - description: Hotkey action name
        in: path
        name: action
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/settings.updateHotkeyRequest'
                description: New key binding
                summary: body
        description: New key binding
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/settings.hotkeyUpdateResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httputil.ErrResp'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httputil.ErrResp'
          description: Not Found
      summary: Update a single hotkey
      tags:
      - hotkeys
  /hotkeys/pause:
    post:
      description: Suspends global hotkey dispatch without unregistering bindings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/settings.statusResponse'
          description: OK
      summary: Pause hotkeys
      tags:
      - hotkeys
  /hotkeys/resume:
    post:
      description: Re-enables hotkey dispatch after a pause
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/settings.statusResponse'
          description: OK
      summary: Resume hotkeys
      tags:
      - hotkeys
  /hotkeys/status:
    get:
      description: Reports whether the hotkey backend is available
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/settings.hotkeysStatusResponse'
          description: OK
      summary: Get hotkey status
      tags:
      - hotkeys
  /license/accept:
    post:
      description: Records that the user has accepted the AGPLv3 license
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/system.licenseAcceptResponse'
          description: OK
      summary: Accept license
      tags:
      - system
  /licenses:
    get:
      description: Returns all collected third-party license entries
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/licenses.Entry'
                type: array
          description: OK
      summary: Get third-party licenses
      tags:
      - system
  /overlay/state:
    get:
      description: Returns the active Pokemon and its ID for the OBS overlay page
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/system.overlayStateResponse'
          description: OK
      summary: Get overlay state
      tags:
      - overlay
  /permissions:
    get:
      description: Returns the current Accessibility and Screen Recording permission
        state
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/permissions.Status'
          description: OK
      summary: Get permission status
      tags:
      - permissions
  /permissions/request:
